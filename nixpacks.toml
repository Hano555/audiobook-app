[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_sqlite", "php84Extensions.mbstring", "php84Extensions.xml", "php84Extensions.curl", "php84Extensions.zip", "php84Extensions.gd", "ffmpeg", "nodejs_20", "nodePackages.npm"]

[phases.install]
cmds = ["composer install --optimize-autoloader --no-scripts --no-interaction", "NODE_OPTIONS=--max-old-space-size=512 npm install"]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=512 npm run build", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
